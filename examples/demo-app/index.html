<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo App — Contacts</title>
  <style>
    :root { --bg: #f6f5f2; --card: #fff; --ink: #1b1b1b; --muted: #6b6b6b; --accent: #ff5c35; --ok: #1f8a4c; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
    header { padding: 20px 32px; border-bottom: 1px solid #e4e2dd; background: var(--card); display: flex; gap: 24px; align-items: center; }
    header strong { font-size: 18px; }
    nav a { color: var(--muted); text-decoration: none; margin-right: 16px; }
    main { max-width: 720px; margin: 40px auto; padding: 0 16px; }
    .card { background: var(--card); border-radius: 14px; padding: 28px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    label { display: block; font-weight: 600; margin: 14px 0 6px; }
    input, textarea { width: 100%; padding: 10px 12px; border: 1px solid #d8d5cf; border-radius: 8px; font: inherit; }
    button { margin-top: 18px; padding: 11px 20px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: 600 16px inherit; cursor: pointer; }
    #toast { position: fixed; top: 20px; right: 20px; padding: 14px 18px; border-radius: 10px; background: var(--ok); color: #fff;
      font-weight: 600; transform: translateY(-120px); transition: transform 250ms ease; }
    #toast.on { transform: none; }
    ul { padding-left: 18px; }
    /* Simulated dev overlay: demo-capture must hide it. */
    nextjs-portal { position: fixed; left: 12px; bottom: 12px; width: 40px; height: 40px; border-radius: 50%; background: #000; }
  </style>
</head>
<body>
  <header><strong>Contacts</strong><nav><a href="#">Liste</a><a href="#">Nouveau</a></nav></header>
  <main>
    <div class="card">
      <h1>Nouveau contact</h1>
      <form id="f">
        <label for="name">Nom</label>
        <input id="name" name="name" placeholder="Ada Lovelace" />
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="ada@example.com" />
        <label for="note">Note</label>
        <textarea id="note" name="note" rows="3"></textarea>
        <button type="submit" data-testid="save">Enregistrer</button>
      </form>
    </div>
    <div class="card" style="margin-top:24px">
      <h2>Contacts enregistrés</h2>
      <ul id="list"><li>Grace Hopper</li></ul>
    </div>
  </main>
  <div id="toast" role="status">Contact enregistré</div>
  <nextjs-portal></nextjs-portal>
  <script>
    document.getElementById("f").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value.trim() || "Sans nom";
      const li = document.createElement("li");
      li.textContent = name;
      document.getElementById("list").appendChild(li);
      const t = document.getElementById("toast");
      t.classList.add("on");
      setTimeout(() => t.classList.remove("on"), 2500);
    });
  </script>
</body>
</html>
